<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Афіша подій міста</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Unbounded:wght@600;700&display=swap">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3.5.45/dist/vue.global.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
<header>
  <h1>АФІША ПОДІЙ МІСТА</h1>
  <nav>
    <a href="#/" data-link>НАЙБЛИЖЧІ</a>
    <a href="#/" data-link data-section="events">ПОДІЇ</a>
    <a href="#/" data-link data-section="holidays">СВЯТА</a>
    <a href="#/" data-link data-section="add-event">ДОДАТИ ПОДІЮ</a>
    <a href="#/saved" data-link>ОБРАНЕ</a>
  </nav>
</header>

<main class="layout" id="app" v-cloak>
  <component :is="page.view" v-bind="page.params" :key="path"></component>
</main>

<footer>
  <p>Контакти організаторів: info@afisha-mista.ua, +38 (0__) ___-__-__</p>
</footer>

<template id="home-view">
  <section id="upcoming">
    <h2>НАЙБЛИЖЧІ ПОДІЇ</h2>
    <p class="upcoming-empty" v-if="app.upcomingEvents.length === 0">Найближчим часом подій немає.</p>
    <ol class="upcoming-list" id="upcoming-list" v-else>
      <li class="upcoming-item" v-for="(item, index) in app.upcomingEvents" :key="item.id" :style="{ '--i': index }">
        <div class="upcoming-item__text">
          <strong><a :href="app.eventHref(item.id)" data-link>{{ item.name }}</a></strong>
          <span>{{ app.savedDateText(item.date) }} · {{ item.location }}</span>
        </div>
        <p class="upcoming-item__days" :class="{ 'upcoming-item__days--today': item.daysLeft === 0 }">{{ item.daysText }}</p>
        <days-progress :days-left="item.daysLeft"></days-progress>
      </li>
    </ol>
  </section>

  <section id="filters">
    <h2>ФІЛЬТР ЗА ДАТОЮ ТА КАТЕГОРІЄЮ</h2>
    <form>
      <div>
        <label for="filter-date">ДАТА</label>
        <input type="date" id="filter-date" name="date">
      </div>

      <div>
        <p class="filter-label" id="filter-category-label">КАТЕГОРІЯ</p>
        <div class="filter-buttons" id="category-filters" role="group" aria-labelledby="filter-category-label">
          <button v-for="option in app.categoryFilters" :key="option.value" type="button"
                  :data-category="option.value"
                  :class="{ active: app.activeCategory === option.value }"
                  :aria-pressed="app.activeCategory === option.value"
                  @click="app.activeCategory = option.value">{{ option.label }}</button>
        </div>
      </div>
    </form>
  </section>

  <section id="events">
    <h2>ПОДІЇ</h2>

    <p id="events-count">{{ app.countText }}</p>

    <div class="cards" id="events-list">
      <event-card v-for="item in app.visibleEvents" :key="item.id" :id="item.id"
                  :title="item.title" :category="item.category" :date="item.date"
                  :image="item.image" :place="item.place" :address="item.address"
                  :saved="app.savedIds.has(item.id)" @toggle-save="app.toggleSaved(item)"></event-card>
    </div>
  </section>

  <section id="holidays">
    <h2>ДЕРЖАВНІ СВЯТА 2026</h2>
    <div class="holidays-bar">
      <button type="button" class="btn-secondary" id="holidays-reload"
              :disabled="app.holidaysLoading" @click="app.loadHolidays()">ОНОВИТИ</button>
      <p class="loading" id="holidays-loading" v-if="app.holidaysLoading">Завантаження свят…</p>
    </div>
    <p class="load-error" id="holidays-error" role="alert" v-if="app.holidaysError">{{ app.holidaysError }}</p>
    <div class="cards" id="holidays-list" :aria-busy="app.holidaysLoading">
      <event-card v-for="holiday in app.holidays" :key="holiday.id" :id="holiday.id"
                  :title="holiday.title" :category="holiday.category" :date="holiday.date"
                  :note="holiday.note"
                  :saved="app.savedIds.has(holiday.id)" @toggle-save="app.toggleSaved(holiday)"></event-card>
    </div>
  </section>

  <section id="add-event">
    <h2>ДОДАТИ ПОДІЮ</h2>
    <form id="add-event-form" @submit.prevent="app.addEvent">
      <div class="form-field form-field--wide">
        <label for="add-title">НАЗВА</label>
        <input type="text" id="add-title" name="title" required pattern=".{3,}" aria-describedby="add-title-error"
               v-model="app.newTitle" @input="app.validateTitle" @invalid="app.validateTitle">
        <p class="field-error" id="add-title-error" aria-live="polite">{{ app.titleError }}</p>
      </div>

      <div class="form-field">
        <label for="add-category">КАТЕГОРІЯ</label>
        <select id="add-category" name="category" required v-model="app.newCategory">
          <option value="">ОБЕРІТЬ КАТЕГОРІЮ</option>
          <option value="concert">КОНЦЕРТИ</option>
          <option value="theatre">ТЕАТР</option>
          <option value="standup">СТЕНДАП</option>
        </select>
      </div>

      <div class="form-field">
        <label for="add-date">ДАТА</label>
        <input type="date" id="add-date" name="date" required v-model="app.newDate">
      </div>

      <button type="submit" class="btn-submit">ДОДАТИ ПОДІЮ</button>
    </form>
  </section>
</template>

<template id="event-view">
  <p class="loading" v-if="!event && (app.holidaysLoading || app.savedLoading)">Завантаження події…</p>
  <section id="event-page" v-else-if="event">
    <a class="back-link" href="#/" data-link>← ДО АФІШІ</a>
    <h2>ДЕТАЛІ ПОДІЇ</h2>
    <div class="event-details">
      <event-card :id="event.id" :title="event.title" :category="event.category" :date="event.date"
                  :image="event.image" :place="event.place" :address="event.address" :note="event.note"
                  :linked="false" :saved="app.savedIds.has(event.id)" @toggle-save="app.toggleSaved(event)"></event-card>
      <dl class="details-list">
        <template v-for="row in details" :key="row.label">
          <dt>{{ row.label }}</dt>
          <dd>{{ row.value }}</dd>
        </template>
      </dl>
    </div>
  </section>
  <not-found-view v-else title="ПОДІЮ НЕ ЗНАЙДЕНО" :text="'Події з id «' + id + '» немає в афіші.'"></not-found-view>
</template>

<template id="saved-view">
  <section id="saved-events">
    <h2>ОБРАНІ ПОДІЇ</h2>
    <p class="load-error" id="storage-error" role="alert" v-if="app.storageError">{{ app.storageError }}</p>
    <p class="loading" v-if="app.savedLoading">Завантаження обраного…</p>
    <p class="saved-empty" v-else-if="app.sortedSaved.length === 0">Натисніть «Додати в обране» на картці події, і вона
      збережеться тут навіть після перезавантаження сторінки.</p>
    <ul class="saved-list" id="saved-list" v-else>
      <li v-for="item in app.sortedSaved" :key="item.id">
        <time :datetime="item.date">{{ app.savedDateText(item.date) }}</time>
        <strong><a :href="app.eventHref(item.id)" data-link>{{ item.name }}</a></strong>
        <span>{{ item.location }}</span>
        <button type="button" class="saved-remove" :aria-label="'Видалити «' + item.name + '» з обраного'"
                @click="app.toggleSaved(item)">ВИДАЛИТИ</button>
      </li>
    </ul>
  </section>
</template>

<template id="not-found-view">
  <section class="not-found">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <a class="back-link" href="#/" data-link>← НА ГОЛОВНУ</a>
  </section>
</template>

</body>
</html>
